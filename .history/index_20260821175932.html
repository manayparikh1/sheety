<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sheety</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #e9ddbb;
            --paper: #ffffff;
            --navy: #3d3d80;
            --red: #e8736f;
            --blue: #4979ad;
            --green: #8dc68b;
            --yellow: #f2e394;
            --orange: #f2ae72;
            --purple: #cd93dd;
            --grey: #a9a9a9;
            --black-key: #494646;
            --line-black: #222222;
        }

        html,
        body {
            background-color: var(--blue);
            font-family: "Comic Neue", "Architects Daughter", "Patrick Hand", "Chalkboard SE", cursive, sans-serif;
            color: var(--paper);
            min-height: 100%;
        }

        header {
            background: var(--red);
            color: var(--paper);
            padding: 19.5px;
            text-align: center;
            border-bottom: 6px solid var(--purple);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 5.7px;
            font-size: 1.2rem;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            background: var(--cream);
            border: 4px solid var(--navy);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        section h2 {
            color: var(--blue);
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toolbar-group label {
            font-size: 0.85rem;
            color: var(--grey);
        }

        select,
        input[type="range"] {
            font-family: inherit;
            font-size: 1rem;
            padding: 6px;
            border: 3px solid var(--navy);
            border-radius: 8px;
            background: var(--yellow);
            color: var(--navy);
        }

        button {
            font-family: inherit;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--yellow);
            font-size: 1rem;
            color: var(--navy);
            cursor: pointer;
            border: 3px solid var(--green);
        }

        button:hover {
            background: var(--orange);
            color: var(--green);
        }

        button:active {
            background: var(--red);
            color: var(--cream)
        }

        button.play-btn {
            background: var(--green);
            color: var(--cream);
        }

        button.play-btn:hover {
            background: var(--navy);
        }

        button.stop-btn {
            background: var(--red);
            color: var(--paper);
        }

        button.stop-btn:hover {
            background: var(--navy);
        }

        button.small {
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        #staffWrap {
            overflow-x: auto;
            border: 3px dashed var(--grey);
            border-radius: 8px;
            padding: 10px;
            background: var(--paper);
        }

        svg#staffSvg {
            background: var(--cream);
            display: block;
        }

        .staff-line {
            stroke: var(--line-black);
            stroke-width: 2;
        }

        .bar-line {
            stroke: var(--grey);
            stroke-width: 2;
        }

        .note-head {
            fill: var(--navy);
            stroke: var(--navy);
            stroke-width: 1;
        }

        .note-head.playing {
            fill: var(--red);
            stroke: var(--red);
        }

        .note-stem {
            stroke: var(--navy);
            stroke-width: 2;
        }

        .rest-mark {
            fill: var(--grey);
        }

        .ledger-line {
            stroke: var(--line-black);
            stroke-width: 2;
        }

        .note-label {
            font-size: 10px;
            fill: var(--blue);
            font-family: "Comic Sans MS", cursive, sans-serif;
        }

        .clef-text {
            font-size: 40px;
            fill: var(--navy);
        }

        #piano {
            display: flex;
            justify-content: center;
            padding: 20px 0;
            gap: 2px;
        }

        .white-key {
            width: 44px;
            height: 150px;
            background: var(--paper);
            border: 3px solid var(--purple);
            border-radius: 008px8px;

        }
    </style>
